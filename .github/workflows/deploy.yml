name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Deploys the Gemini "Ask the architect" and feedback worker to Cloudflare, when the secrets exist.
  worker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FEEDBACK_ADMIN_TOKEN: ${{ secrets.FEEDBACK_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: deploy
        working-directory: worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "Cloudflare or Gemini secret not set; skipping the worker."
            exit 0
          fi
          W="npx --yes wrangler@4"
          # Feedback store: create the KV namespace once, then bind it
          ID=$($W kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const l=JSON.parse(s.slice(s.indexOf("[")));const n=l.find(x=>x.title.endsWith("vastuplan-feedback"));process.stdout.write(n?n.id:"")}catch{}})')
          if [ -z "$ID" ]; then
            $W kv namespace create vastuplan-feedback || true
            ID=$($W kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const l=JSON.parse(s.slice(s.indexOf("[")));const n=l.find(x=>x.title.endsWith("vastuplan-feedback"));process.stdout.write(n?n.id:"")}catch{}})')
          fi
          if [ -n "$ID" ]; then printf '\n[[kv_namespaces]]\nbinding = "FEEDBACK"\nid = "%s"\n' "$ID" >> wrangler.toml; fi
          $W deploy | tee deploy.log
          echo "$GEMINI_API_KEY" | $W secret put GEMINI_API_KEY
          if [ -n "$FEEDBACK_ADMIN_TOKEN" ]; then echo "$FEEDBACK_ADMIN_TOKEN" | $W secret put FEEDBACK_ADMIN_TOKEN; fi
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  build:
    needs: worker
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/vastuplan/' }}
          VITE_ASK_URL: ${{ needs.worker.outputs.url || vars.VITE_ASK_URL }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://babubl.github.io/vastuplan' }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
