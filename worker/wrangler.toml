name = "vastuplan-architect"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
GEMINI_MODEL = "gemini-flash-latest"
# Only these sites may call the worker. Add your custom domain here when you have one.
ALLOWED_ORIGINS = "https://babubl.github.io,http://localhost:5173"

# Secrets (set automatically by .github/workflows/deploy.yml from GitHub secrets):
